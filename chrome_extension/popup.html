<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #FF6B00;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444; transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #FF6B00; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 1.2rem;">🤖</span>
    <span class="title">Pipeta IA Catch</span>
  </div>
  <div class="status-row">
    <span style="font-size: 0.85rem;">Captura Activa</span>
    <label class="switch">
      <input type="checkbox" id="toggleCatch" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div style="font-size: 0.75rem; color: #888; margin-top: 10px; text-align: center;">
    Conectado a http://localhost:3002
  </div>
  <script src="popup.js"></script>
</body>
</html>
